<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUNO · Device preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9ecf5;font-family:system-ui,sans-serif;color:#172141}header{padding:15px 23px;background:#fff;border-bottom:1px solid #dce0ef;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header strong{font-size:15px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{font:600 12px system-ui;border:1px solid #dce0ef;background:#fff;padding:10px 15px;border-radius:10px;text-decoration:none;color:#172141;cursor:pointer}button[aria-pressed=true]{background:#1e3dff;color:#fff;border-color:#1e3dff}main{padding:25px;overflow:auto;min-height:calc(100vh - 75px)}iframe{display:block;margin:auto;background:#f7f8fd;border:0;border-radius:17px;box-shadow:0 12px 45px #29345620;width:375px;height:812px}p{font-size:12px;text-align:center;color:#69738a;margin:0 0 17px}@media(max-width:600px){main{padding:12px}iframe{max-width:100%;height:calc(100vh - 180px)}header{padding:12px}}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex:none}main{flex:1;min-height:0;min-height:0;overflow-x:auto;overflow-y:hidden;padding:18px 25px}iframe{height:calc(100dvh - 140px);max-height:812px}@media(max-width:600px){main{padding:10px}iframe{height:calc(100dvh - 200px)}} </style></head><body><header><strong>ZUNO KIDS · Discovery preview</strong><nav aria-label="Preview size"><button data-width="375" aria-pressed="true">Phone · 375</button><button data-width="768" aria-pressed="false">Tablet · 768</button><button data-width="1024" aria-pressed="false">Web · 1024</button><a href="/">Open app ↗</a></nav></header><main><p>Explore the real app at each screen size. Progress stays in this browser.</p><iframe src="/#/discover" title="ZUNO app preview" id="device"></iframe></main><script>const reviewParams=new URLSearchParams(location.search),reviewRoute=reviewParams.get('route'),reviewWidth=reviewParams.get('width');if(reviewRoute&&/^[a-z0-9/-]+$/.test(reviewRoute))document.getElementById('device').src='/#/'+reviewRoute;if(['375','768','1024'].includes(reviewWidth)){document.getElementById('device').style.width=reviewWidth+'px';document.querySelectorAll('button[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===reviewWidth)))}document.querySelectorAll('button[data-width]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('device').style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></body></html>
